<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Surprise for Suriya 💙❤️✨</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
}

/* Card */
.card{
    background:red and blue;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    width:320px;
}

/* Button */
button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4b7d;
    color:red and blue;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Hidden message */
#message{
    display:none;
    margin-top:20px;
    font-size:18px;
    color:#ff4b7d;
}

/* Heart animation */
.heart{
    font-size:60px;
    animation: beat 1s infinite;
}

@keyframes beat{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<div class="card">
    <h2>Hi Suriya 💙</h2>
    <p>I built something special for you...</p>

    <button onclick="showSurprise💙❤️()">🎁 Click for Surprise</button>

    <div id="message">
        <div class="heart">💙❤️</div>
        <p>
            Enakku needha ma ellame ,<br>
            love you mama ,<br>
           💙❤️✨ .<br><br>
            Happy Valentine’s Day 💙❤️✨ <br>
            – Swathi
        </p>
    </div>
</div>

<script>
function showSurprise(){
    document.getElementById("message").style.display="block";
}
</script>

</body>
</html>
